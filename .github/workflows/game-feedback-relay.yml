name: Publish game feedback issues

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: game-feedback-relay
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'guylfe/ygo-rogue-duelist-edison' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      id-token: write
      issues: write
    steps:
      - name: Process feedback through the shared service
        env:
          RELAY_URL: https://guylfe-game-feedback.netlify.app/v1/github-relay
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = process.env.RELAY_URL;
          const identityURL = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          identityURL.searchParams.set('audience', endpoint);
          const identity = await fetch(identityURL, {
            headers: {Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}
          });
          if (!identity.ok) throw Error('Could not get GitHub job identity (' + identity.status + ')');
          const {value} = await identity.json();
          const result = await fetch(endpoint, {
            method:'POST', redirect:'error', signal:AbortSignal.timeout(45000),
            headers:{Authorization:'Bearer ' + value, 'Content-Type':'application/json'},
            body:JSON.stringify({githubToken:process.env.GH_TOKEN})
          });
          if (!result.ok) throw Error('Feedback relay failed (' + result.status + ')');
          const counts = await result.json();
          console.log(JSON.stringify(counts));
          if (counts.failed) process.exitCode = 1;
          NODE
