  <h1>0.2.41 · La busta del tuo duellante in ogni atto</h1>
  <p>Il negozio in solitaria offre la busta del tuo duellante in ogni atto. Puoi ancora contrassegnare un’altra busta. Ogni busta contiene carte ammesse nell’atto corrente.</p>
